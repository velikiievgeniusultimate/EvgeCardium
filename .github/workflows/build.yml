name: Build EvgeCardium

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EvgeCardium-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  game-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package downloadable game
        run: ./tools/package-update.sh 1 > game-v1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EvgeCardium-game-v1
          path: |
            dist/game-v1.zip
            game-v1.sha256
